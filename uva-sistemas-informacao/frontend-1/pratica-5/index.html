<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>RM Tech Solutions - Criar Conta</title>
</head>
<body>

    <main class="pagina">
        <div class="cartao">

            <div class="cabecalho-cartao">
                <div class="logo">RM</div>
                <h1>Criar conta</h1>
                <p>Acesse o portal de clientes da RM Tech Solutions</p>
            </div>

            <form id="formCadastro" novalidate>

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" autocomplete="name">
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="text" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email">
                    <p class="mensagem" id="msgEmail"></p>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" autocomplete="new-password">

                    <ul class="checklist" id="checklistSenha">
                        <li id="reqTamanho">Mínimo de 8 caracteres</li>
                        <li id="reqMaiuscula">Uma letra maiúscula</li>
                        <li id="reqMinuscula">Uma letra minúscula</li>
                        <li id="reqNumero">Um número</li>
                        <li id="reqEspecial">Um caractere especial (!@#$%...)</li>
                    </ul>

                    <div class="forca-container">
                        <div class="forca-barra" id="forcaBarra"></div>
                    </div>
                    <p class="mensagem" id="msgForca">Força da senha</p>
                </div>

                <div class="campo">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha" autocomplete="new-password">
                    <p class="mensagem" id="msgConfirmar"></p>
                </div>

                <button type="submit" id="btnCadastrar" disabled>Criar conta</button>

                <p class="sucesso" id="msgSucesso"></p>

            </form>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
