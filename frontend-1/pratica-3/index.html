<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>RM Tech Feed - Curtidas</title>
</head>
<body>

    <header>
        <h1>RM Tech Feed</h1>
        <p>Comunidade gamer e tech</p>
    </header>

    <main>

        <!-- Card de post, como um feed de rede social -->
        <article class="post">

            <div class="post-cabecalho">
                <div class="avatar">D4</div>
                <div>
                    <strong>Comunidade Diablo Brasil</strong>
                    <p class="post-data">há 2 horas</p>
                </div>
            </div>

            <p class="post-texto">
                Saiu a nova temporada! Classes reformuladas, eventos por tempo
                limitado e itens novos pra caçar. Quem já testou no PTR?
            </p>

            <div class="post-acoes">
                <!-- botão de curtir, sem recarregar a página -->
                <button id="btnCurtir" class="btn-curtir" type="button">
                    <span id="icone" class="icone">&#9825;</span>
                    <span id="textoBotao">Curtir</span>
                </button>
                <span id="contador" class="contador">0 curtidas</span>
            </div>

        </article>

    </main>

    <footer>
        <p>RM Tech Feed - 2026 - Desenvolvido por Rodrigo Mateus</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
