<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Consulta de Perfil GitHub</title>
</head>
<body>

    <header>
        <h1>Consulta de Perfil GitHub</h1>
        <p>Buscando dados reais em uma API pública</p>
    </header>

    <main>

        <section class="busca">
            <label for="usuario">Usuário do GitHub</label>
            <div class="campo-busca">
                <input type="text" id="usuario" value="rodrigomateus-tech" autocomplete="off">
                <button id="btnBuscar" type="button">Buscar</button>
            </div>
        </section>

        <section id="resultado" class="resultado">
            <p class="mensagem">Digite um usuário e clique em "Buscar".</p>
        </section>

    </main>

    <footer>
        <p>Consumindo api.github.com - 2026 - Rodrigo Mateus</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
